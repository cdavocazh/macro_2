# The full extraction's successful runs take 5-10 min (median 8.3 min over
# 2026-09-16..19), so the unit's TimeoutStartSec=600 killed about one run in
# five part-way through the historical-CSV phase (2 of 14 runs before
# 2026-09-16, 3 of 15 after), which also skips that run's ExecStartPost cache
# repair. 15 min leaves headroom; the closest gap between scheduled runs is 3 h
# (14:00 -> 17:00 UTC).
[Service]
TimeoutStartSec=900
