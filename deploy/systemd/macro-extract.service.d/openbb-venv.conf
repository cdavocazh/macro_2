# Run the daily full extraction under venv-openbb so OpenBB-backed indicators
# (63 VIX curve, 64 put/call OI, 70 IV skew, 67/73/75 and the provider tiers)
# resolve instead of silently degrading.
#
# A separate venv, not the shared one: openbb-core hard-pins uvicorn<0.41, and
# installing it into /root/macro_2/venv would downgrade the uvicorn running
# macro-react.service (0.42.0 -> 0.40.0).  The 5-minute fast/hl extract jobs and
# macro-cache-repair keep using the shared venv and never import OpenBB.
[Service]
ExecStart=
ExecStart=/root/macro_2/venv-openbb/bin/python scheduled_extract.py --cron --force
ExecStartPost=
ExecStartPost=/root/macro_2/venv/bin/python scripts/repair_cache_errors.py

# Observed peak with OpenBB loaded: 1.1G (was ~400M before). Cap at 2G so a runaway
# daily extraction can never squeeze macro-react/btc-react on this 7.8G box.
MemoryMax=2G
MemoryHigh=1500M
